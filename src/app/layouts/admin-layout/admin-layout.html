  <style>

    .admin-menu {
      position: relative;

      display: flex;
      align-items: center;
      gap: 13px;

      width: 100%;
      height: 44px;

      padding: 0 13px;

      border-radius: 9px;

      color: #76675D;

      text-decoration: none;

      font-size: 12px;
      font-weight: 500;

      transition: all 0.2s ease;
    }

    .admin-menu .material-symbols-outlined {
      font-size: 19px;
      color: #A08D7E;

      transition: color 0.2s ease;
    }

    .admin-menu:hover {
      background: #F5F0EA;
      color: #4A3B32;
    }

    .admin-menu:hover .material-symbols-outlined {
      color: #9A7B52;
    }

    .admin-menu.active-menu {
      background: #F1E8DE;
      color: #6F5034;
      font-weight: 600;
    }

    .admin-menu.active-menu::before {
      content: "";

      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;

      width: 3px;

      border-radius: 0 4px 4px 0;

      background: #9A7B52;
    }

    .admin-menu.active-menu .material-symbols-outlined {
      color: #9A7B52;
    }

  </style>
