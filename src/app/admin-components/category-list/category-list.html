<h1>Kategori Listesi</h1>

<table class="table table-hover table-bordored">
<thead>
  <tr>
    <th>#</th>
    <th>Kategori Adı</th>
    <th>Sil</th>
    <th>Güncelle</th>
</tr>
</thead>
 <tbody>
@for (item of categories(); track $index) {

  <tr>
    <td>{{ $index + 1 }}</td>
    <td>{{ item.categoryName }}</td>
    <td><a class="btn btn-danger" (click)="delete(item.id)">Sil</a></td>
    <td><a class="btn btn-info" [routerLink]="['update/', item.id]">Güncelle</a></td>
  </tr>

}
</tbody>
</table>
<a class="btn btn-dark" [routerLink]="['create']">Yeni Kategori Oluştur</a>
