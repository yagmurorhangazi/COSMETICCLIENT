<section id="products" class="py-section-gap px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto bg-surface-bright">
<div class="flex flex-col md:flex-row justify-between items-end mb-stack-lg gap-stack-md">
<div class="max-w-xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Yeni Gelen Ürünler</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Aşağıdan Ürünlerimize Göz Atabilirsiniz</p>
</div>
<a routerLink="/urunler" class="font-label-sm text-label-sm text-primary border-b border-primary pb-1 hover:text-secondary hover:border-secondary transition-all cursor-pointer">
  Tüm Ürünleri Gör
</a></div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter">
<!-- Product Card 1 -->
 @for (item of products(); track $index) {
<div class="group cursor-pointer">
<div class="relative bg-surface-container-lowest aspect-[3/4] mb-stack-md overflow-hidden flex items-center justify-center p-8 shadow-[0_4px_24px_rgba(124,82,99,0.05)] transition-shadow duration-300 group-hover:shadow-[0_8px_32px_rgba(124,82,99,0.1)]">
<span class="absolute top-4 left-4 bg-primary-container text-on-primary-container font-label-sm text-label-sm px-3 py-1 rounded-full">Yeni</span>
<img alt="Radiance Serum" class="w-full h-full object-contain mix-blend-darken transition-transform duration-700 group-hover:scale-105" alt="{{item.name}}" src="{{item.imageUrl}}"/>
<div class="absolute inset-x-0 bottom-0 p-4 opacity-0 transform translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
<button class="w-full bg-surface/90 backdrop-blur text-primary font-label-sm text-label-sm py-3 border border-outline-variant hover:bg-secondary hover:text-on-secondary hover:border-secondary transition-colors">Quick Add</button>
</div>
</div>
<div class="flex justify-between items-start">
<div>
<h3 class="font-headline-md text-[20px] text-on-surface mb-1">{{item.name}}</h3>
<p class="font-body-md text-[14px] text-on-surface-variant">{{item.category.categoryName}}</p>
</div>
<span class="font-body-md text-body-md font-semibold text-primary">{{item.price}} ₺</span>
</div>
</div>
}
</div>
</section>
