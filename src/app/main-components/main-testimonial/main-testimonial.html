<section id="testimonial" class="py-section-gap px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto bg-surface-bright">
  <div class="text-center mb-stack-lg">
    <h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Müşterilerimizin Yorumları</h2>
    <p class="font-body-md text-body-md text-on-surface-variant">Topluluğumuzdan gerçek sonuçlar.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">

    <!-- Dinamik Kart (*ngFor) -->
    <div *ngFor="let item of testimonials" class="bg-surface-container-low p-8 flex flex-col items-center text-center shadow-sm">

      <!-- Profil Görseli veya Varsayılan İkon -->
      <ng-container *ngIf="item.imageUrl; else defaultAvatar">
        <img [src]="item.imageUrl" [alt]="item.fullName" class="w-20 h-20 rounded-full object-cover mb-stack-md" />
      </ng-container>
      <ng-template #defaultAvatar>
        <div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center mb-stack-md">
          <span class="material-symbols-outlined text-primary text-[32px]">person</span>
        </div>
      </ng-template>

      <!-- Dinamik Puan (Yıldızlar) -->
      <div class="flex gap-1 mb-stack-sm text-secondary">
        <span *ngFor="let star of getStars(item.rating)"
              class="material-symbols-outlined text-[18px]"
              style="font-variation-settings: 'FILL' 1">
          star
        </span>
      </div>

      <!-- Yorum Metni -->
      <p class="font-body-md italic text-on-surface mb-stack-md">
        "{{ item.comment }}"
      </p>

      <!-- Müşteri Adı Soyadı -->
      <span class="font-label-sm text-label-sm uppercase tracking-widest text-primary">
        {{ item.fullName }}
      </span>

    </div>

  </div>

  <!-- Yorum Yap Butonu -->
  <div class="text-center mt-12">
    <button type="button"
            class="btn btn-outline-dark px-4 py-2 border border-dark rounded-0"
            data-bs-toggle="modal"
            data-bs-target="#testimonialModal">
      💬 Ürünlerimiz hakkında ne düşünüyorsunuz?
    </button>
  </div>

</section>

<!-- Yorum Gönderme Modal Penceresi (Pop-up Form) -->
<div class="modal fade" id="testimonialModal" tabindex="-1" aria-labelledby="testimonialModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="testimonialModalLabel">Değerlendirmenizi Paylaşın</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body px-4 py-4">
  <form (ngSubmit)="submitTestimonial()" #testimonialForm="ngForm">

    <div class="mb-3">
      <label class="form-label small fw-semibold text-uppercase" style="color:#6b5b52; letter-spacing:.08em;">
        Ad Soyad
      </label>
      <input
        type="text"
        class="form-control border-0 shadow-sm"
        [(ngModel)]="newTestimonial.fullName"
        name="fullName"
        placeholder="Örn: Elif Yılmaz"
        required
        style="background:#FAF7F2; border-radius:10px; padding:12px;"
      >
    </div>

    <div class="mb-3">
      <label class="form-label small fw-semibold text-uppercase" style="color:#6b5b52; letter-spacing:.08em;">
        Profil Görseli
        <span class="text-muted text-lowercase">(opsiyonel)</span>
      </label>
      <input
        type="text"
        class="form-control border-0 shadow-sm"
        [(ngModel)]="newTestimonial.imageUrl"
        name="imageUrl"
        placeholder="https://..."
        style="background:#FAF7F2; border-radius:10px; padding:12px;"
      >
    </div>

    <div class="mb-3">
      <label class="form-label small fw-semibold text-uppercase" style="color:#6b5b52; letter-spacing:.08em;">
        Puanınız
      </label>
      <select
        class="form-select border-0 shadow-sm"
        [(ngModel)]="newTestimonial.rating"
        name="rating"
        required
        style="background:#FAF7F2; border-radius:10px; padding:12px;"
      >
        <option [ngValue]="5">★★★★★ 5 - Mükemmel</option>
        <option [ngValue]="4">★★★★☆ 4 - Çok İyi</option>
        <option [ngValue]="3">★★★☆☆ 3 - İyi</option>
        <option [ngValue]="2">★★☆☆☆ 2 - Orta</option>
        <option [ngValue]="1">★☆☆☆☆ 1 - Kötü</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="form-label small fw-semibold text-uppercase" style="color:#6b5b52; letter-spacing:.08em;">
        Yorumunuz
      </label>
      <textarea
        class="form-control border-0 shadow-sm"
        [(ngModel)]="newTestimonial.comment"
        name="comment"
        rows="4"
        placeholder="Lumière deneyiminizi paylaşın..."
        required
        style="background:#FAF7F2; border-radius:10px; padding:12px; resize:none;"
      ></textarea>
    </div>

    <button
      type="submit"
      class="btn w-100 rounded-pill py-2"
      [disabled]="!testimonialForm.form.valid"
      style="background:#8A653B; color:white;"
    >
      Yorumu Gönder
    </button>

  </form>
</div>

    </div>
  </div>
</div>
